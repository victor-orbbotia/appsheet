<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Orbbotia</title>
<script src="assets/admin-config.js"></script><script src="assets/supabase-2.57.4.js"></script><script src="assets/admin-session.js"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fc;color:#17233c;font:16px system-ui}main{width:min(400px,calc(100% - 64px));padding:32px;background:white;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 12px 40px #25345b0a}h1{font-size:28px;margin:8px 0}p{color:#64748b;line-height:1.6}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;min-height:48px;border-radius:10px;padding:12px;font:inherit}input{border:1px solid #cbd5e1}button{margin-top:24px;background:#4f46e5;color:white;border:0;cursor:pointer}button:disabled{opacity:.55}input:focus-visible,button:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}#status{min-height:24px;color:#b42318;font-size:14px}.brand{color:#4f46e5;font-weight:700;letter-spacing:.04em}</style></head>
<body><main><span class="brand">ORBBOTIA</span><h1>Bem-vindo de volta</h1><p>Entre para gerenciar seu estabelecimento. Sua sessão acompanha as outras abas.</p>
<form id="login"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button id="entrar" disabled>Entrar</button></form><p id="status" role="status" aria-live="polite"></p><p style="font-size:13px">Precisa de acesso ou esqueceu a senha? Fale com o responsável pelo estabelecimento.</p></main>
<script>
const status=document.getElementById('status'),button=document.getElementById('entrar');
AdminSession.ready.then(()=>{button.disabled=false;}).catch(e=>{status.textContent=e.message;});
document.getElementById('login').onsubmit=async e=>{e.preventDefault();button.disabled=true;status.textContent='Entrando…';try{const client=await AdminSession.ready;if(!client)throw Error('Acesso indisponível.');const result=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('senha').value});if(result.error)throw Error('Não foi possível entrar. Confira seu e-mail e sua senha.');location.replace(AdminSession.safeReturn(new URLSearchParams(location.search).get('retorno')));}catch(error){status.textContent=error.message;button.disabled=false;}};
</script></body></html>
