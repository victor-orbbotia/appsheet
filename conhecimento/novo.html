<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Conhecimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .input-field {
            width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; 
            border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
            font-size: 0.875rem; line-height: 1.5;
        }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
    </style>
</head>
<body class="p-4 md:p-6 space-y-6">

    <div id="alerta-chatwoot" class="max-w-4xl mx-auto bg-amber-50 text-amber-700 text-xs p-3 rounded border border-amber-200 shadow-sm">
        ⏳ Conectando ao painel...
    </div>

    <div id="app-container" class="max-w-4xl mx-auto space-y-4 hidden">
        
        <!-- BOTÃO VOLTAR -->
        <div>
            <a id="link-voltar" href="../index.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Voltar ao Menu Principal
            </a>
        </div>

        <div class="bg-white shadow-sm border border-slate-200 rounded-lg overflow-hidden">
            <div class="flex justify-between items-center p-4 md:p-6 border-b border-slate-100 bg-slate-50/50">
                <div>
                    <h1 class="text-lg font-semibold text-slate-800">Base de Conhecimento (IA / Agentes)</h1>
                    <p id="badge-segmento" class="text-xs font-bold text-indigo-600 uppercase tracking-wide mt-1">Segmento: Carregando...</p>
                </div>
                <button type="button" id="btnSalvar" onclick="salvarConhecimento()" class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded hover:bg-blue-800 transition-colors shadow-sm">
                    Salvar Informações
                </button>
            </div>

            <div class="p-4 md:p-6">
                <textarea id="texto_base" class="input-field h-64 resize-y" maxlength="3000" placeholder="Ex:&#10;1. Nosso horário de funcionamento é de segunda a sexta, das 08h às 18h.&#10;2. O prazo de entrega padrão é de 45 minutos.&#10;3. Aceitamos PIX, Cartões de Crédito e Dinheiro."></textarea>
                
                <div class="flex justify-end mt-2">
                    <span id="contador" class="text-xs font-medium text-slate-400">0 / 3000 caracteres</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const urlDados = 'https://n8n.orbbotia.com/webhook/conhecimento-dados';
        const urlAcao  = 'https://n8n.orbbotia.com/webhook/conhecimento-acao';
        
        let globalAccountId = null;
        let segmentoAtual = 'institucional'; // Valor padrão de fallback
        let handshakeInterval;

        // PARÂMETROS DA URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('account_id')) globalAccountId = urlParams.get('account_id');
        if (urlParams.get('segmento')) segmentoAtual = urlParams.get('segmento');

        // CONTADOR DE CARACTERES
        const textArea = document.getElementById('texto_base');
        const contador = document.getElementById('contador');

        textArea.addEventListener('input', function() {
            const qtd = this.value.length;
            contador.innerText = `${qtd} / 3000 caracteres`;
            
            if (qtd >= 2900) contador.classList.replace('text-slate-400', 'text-amber-500');
            else contador.classList.replace('text-amber-500', 'text-slate-400');
        });

        // CHATWOOT INIT
        window.addEventListener('message', function (event) {
            let eventData = {};
            try { eventData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch (e) { return; }

            if (eventData.event === 'appContext' && eventData.data) {
                clearInterval(handshakeInterval);
                globalAccountId = (eventData.data.account && eventData.data.account.id) || (eventData.data.conversation && eventData.data.conversation.account_id) || globalAccountId;
                iniciarApp();
            }
        });

        handshakeInterval = setInterval(() => {
            if (!globalAccountId) window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
        }, 500);

        setTimeout(() => {
            if(!globalAccountId) {
                globalAccountId = '2';
                iniciarApp();
            }
        }, 2000);

        function iniciarApp() {
            document.getElementById('alerta-chatwoot').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            // Injeta o account_id e o segmento no link de voltar
            document.getElementById('link-voltar').href = `../index.html?account_id=${globalAccountId}&segmento=${segmentoAtual}`;
            document.getElementById('badge-segmento').innerText = `Segmento: ${segmentoAtual}`;

            carregarDados();
        }

        // PUXAR DADOS (GET)
        async function carregarDados() {
            try {
                // Adicionado &segmento na requisição GET
                const res = await fetch(`${urlDados}?account_id=${globalAccountId}&segmento=${segmentoAtual}`);
                if (res.ok) {
                    const dados = await res.json();
                    if (dados && dados.length > 0) {
                        textArea.value = dados[0].texto_base || '';
                        textArea.dispatchEvent(new Event('input')); // Atualiza o contador
                    }
                }
            } catch (error) {
                console.error("Erro ao carregar base de conhecimento", error);
            }
        }

        // SALVAR DADOS (POST)
        async function salvarConhecimento() {
            const btnSalvar = document.getElementById('btnSalvar');
            const texto = textArea.value.trim();
            
            btnSalvar.innerText = 'Salvando...';
            btnSalvar.disabled = true;

            const payload = {
                account_id: globalAccountId.toString(),
                segmento: segmentoAtual, // Adicionado segmento no body do POST
                texto_base: texto
            };

            try {
                const response = await fetch(urlAcao, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btnSalvar.innerText = 'Salvo! ✓';
                    btnSalvar.classList.replace('bg-blue-700', 'bg-emerald-600');
                    setTimeout(() => { 
                        btnSalvar.classList.replace('bg-emerald-600', 'bg-blue-700');
                        btnSalvar.innerText = 'Salvar Informações'; 
                        btnSalvar.disabled = false;
                    }, 1500);
                } else {
                    throw new Error();
                }
            } catch (error) {
                alert("Erro ao salvar.");
                btnSalvar.innerText = 'Salvar Informações';
                btnSalvar.disabled = false;
            }
        }
    </script>
</body>
</html>
