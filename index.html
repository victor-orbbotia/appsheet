<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Profissional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .input-field {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; 
            border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
        }
        .input-field:focus { border-color: #2563eb; ring: 1px solid #2563eb; }
    </style>
</head>
<body class="h-screen flex flex-col p-6">

    <!-- Container Principal -->
    <div class="max-w-2xl w-full mx-auto bg-white shadow-sm border border-slate-200 rounded-lg flex flex-col">
        
        <!-- Header igual ao da imagem -->
        <div class="flex justify-between items-center p-6 border-b border-slate-100">
            <h1 class="text-xl font-semibold text-slate-800">Novo Profissional</h1>
            <div class="flex gap-3">
                <button type="button" onclick="limparFormulario()" class="px-4 py-2 text-sm font-medium text-blue-700 bg-white border border-blue-700 rounded hover:bg-blue-50 transition-colors">
                    Cancelar
                </button>
                <button type="button" id="btnSalvar" onclick="salvarProfissional()" class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded hover:bg-blue-800 transition-colors">
                    Salvar
                </button>
            </div>
        </div>

        <!-- Formulário -->
        <form id="formProfissional" class="p-6 space-y-6">
            
            <!-- Alerta de Conexão com Chatwoot -->
            <div id="alerta-chatwoot" class="hidden bg-amber-50 text-amber-700 text-xs p-3 rounded border border-amber-200">
                Aguardando conexão com o Chatwoot para identificar a conta...
            </div>

            <div>
                <label class="block text-sm text-slate-600 mb-1">Nome <span class="text-blue-600">*</span></label>
                <input type="text" id="nome" required class="input-field" placeholder="Ex: Dr. João Silva">
            </div>

            <div>
                <label class="block text-sm text-slate-600 mb-1">Especialidade</label>
                <select id="especialidade" class="input-field bg-white">
                    <option value="" disabled selected>Selecione uma especialidade...</option>
                    <option value="Clínico Geral">Clínico Geral</option>
                    <option value="Cardiologista">Cardiologista</option>
                    <option value="Ginecologista">Ginecologista</option>
                    <option value="Pediatra">Pediatra</option>
                    <option value="Ortopedista">Ortopedista</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-slate-600 mb-1">Telefone</label>
                <input type="tel" id="telefone" class="input-field" placeholder="(11) 99999-9999">
            </div>
        </form>

        <!-- Feedback de Sucesso (Oculto por padrão) -->
        <div id="msgSucesso" class="hidden p-4 mb-6 mx-6 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded text-center font-medium">
            Profissional cadastrado com sucesso!
        </div>
    </div>

    <script>
        const urlWebhookN8N = 'https://n8n.orbbotia.com/webhook/novo-profissional';
        
        let globalAccountId = null; // Será preenchido pelo Chatwoot
        let handshakeInterval;

        // 1. Escuta o Chatwoot para pegar o Account ID (Igual ao seu Kanban)
        window.addEventListener('message', function (event) {
            let eventData = {};
            try { eventData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch (e) { return; }

            if (eventData.event === 'appContext' && eventData.data) {
                clearInterval(handshakeInterval);
                const payload = eventData.data;
                globalAccountId = (payload.account && payload.account.id) || (payload.conversation && payload.conversation.account_id);
                document.getElementById('alerta-chatwoot').classList.add('hidden');
            }
        });

        // Fica pedindo o contexto até o Chatwoot responder
        handshakeInterval = setInterval(function() {
            if (!globalAccountId) {
                window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
            }
        }, 500);

        // Apenas para testes fora do iframe:
        setTimeout(() => {
            if(!globalAccountId) {
                document.getElementById('alerta-chatwoot').classList.remove('hidden');
                document.getElementById('alerta-chatwoot').innerText = "Modo de teste: Rodando fora do Chatwoot (Account ID = 'teste')";
                globalAccountId = 'teste';
            }
        }, 3000);


        // 2. Função para salvar os dados
        async function salvarProfissional() {
            const nome = document.getElementById('nome').value.trim();
            const especialidade = document.getElementById('especialidade').value;
            const telefone = document.getElementById('telefone').value.trim();
            const btnSalvar = document.getElementById('btnSalvar');

            if (!nome) {
                alert("O campo Nome é obrigatório!");
                document.getElementById('nome').focus();
                return;
            }

            if (!globalAccountId) {
                alert("Erro: ID da conta não identificado.");
                return;
            }

            // Alterar visual do botão enquanto carrega
            btnSalvar.innerText = 'Salvando...';
            btnSalvar.disabled = true;
            btnSalvar.classList.add('opacity-70');

            const payload = {
                account_id: globalAccountId.toString(),
                nome: nome,
                especialidade: especialidade,
                telefone: telefone
            };

            try {
                const response = await fetch(urlWebhookN8N, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    mostrarSucesso();
                    limparFormulario();
                } else {
                    throw new Error("Erro ao salvar no n8n");
                }
            } catch (error) {
                console.error(error);
                alert("Ocorreu um erro ao tentar cadastrar o profissional.");
            } finally {
                btnSalvar.innerText = 'Salvar';
                btnSalvar.disabled = false;
                btnSalvar.classList.remove('opacity-70');
            }
        }

        function limparFormulario() {
            document.getElementById('formProfissional').reset();
        }

        function mostrarSucesso() {
            const msg = document.getElementById('msgSucesso');
            const form = document.getElementById('formProfissional');
            msg.classList.remove('hidden');
            form.classList.add('hidden');
            
            setTimeout(() => {
                msg.classList.add('hidden');
                form.classList.remove('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
