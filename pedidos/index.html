<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos — Monitor de Pagamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
            font-family: system-ui, sans-serif;
        }

        .kanban-col {
            min-width: 272px;
            max-width: 300px;
            flex-shrink: 0;
        }

        .card-pedido {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .card-pedido:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #toast.hidden {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        ::-webkit-scrollbar {
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
    </style>
</head>

<body class="p-4 md:p-5 min-h-screen flex flex-col gap-4">

    <!-- Alerta Chatwoot -->
    <div id="alerta-chatwoot"
        class="bg-amber-50 text-amber-700 text-xs p-3 rounded-lg border border-amber-200 shadow-sm">
        ⏳ Conectando ao painel Chatwoot...
    </div>

    <!-- Toast de feedback -->
    <div id="toast"
        class="hidden fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-sm font-semibold text-white">
    </div>

    <!-- App principal -->
    <div id="app-container" class="hidden flex flex-col flex-1 gap-4">

        <!-- Cabeçalho com Filtro de Data -->
        <div class="flex items-center justify-between gap-3 flex-wrap bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-3">
                <a href="../index.html"
                    class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Menu
                </a>
                <span class="text-slate-300">|</span>
                <h1 class="text-base font-bold text-slate-800">📦 Gestão de Pedidos</h1>
            </div>

            <div class="flex items-center gap-2">
                <label for="filtroData" class="text-xs font-semibold text-slate-500">Filtrar Dia:</label>
                <input type="date" id="filtroData" onchange="carregarPedidos()"
                    class="text-xs font-medium bg-slate-50 border border-slate-200 text-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-500">
                <button onclick="setHoje()"
                    class="text-[11px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 px-2.5 py-1.5 rounded-lg transition-colors">
                    Hoje
                </button>
                <button id="btnAtualizar" onclick="carregarPedidos()"
                    class="flex items-center gap-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 hover:border-indigo-300 hover:text-indigo-600 px-3 py-1.5 rounded-lg transition-colors shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                        </path>
                    </svg>
                    Atualizar
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="area-loading" class="flex flex-col items-center justify-center py-20 gap-3">
            <svg class="animate-spin h-7 w-7 text-indigo-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            <p class="text-sm text-slate-400 font-medium">Carregando pedidos...</p>
        </div>

        <!-- Kanban Board -->
        <div id="kanban-board" class="hidden flex gap-4 overflow-x-auto pb-2 flex-1">
            <!-- Coluna: Aguardando PIX -->
            <div class="kanban-col flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-amber-400 shadow-sm"></span>
                        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wide">🕐 Aguardando PIX</h2>
                    </div>
                    <span id="count-aguardando_pix" class="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-amber-200">0</span>
                </div>
                <div id="col-aguardando_pix" class="flex flex-col gap-3 min-h-[120px]"></div>
            </div>

            <!-- Coluna: Pagamento na Entrega (Dinheiro / Cartão) -->
            <div class="kanban-col flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-purple-500 shadow-sm"></span>
                        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wide">💵 Cartão / Dinheiro</h2>
                    </div>
                    <span id="count-pagamento_entrega" class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-purple-200">0</span>
                </div>
                <div id="col-pagamento_entrega" class="flex flex-col gap-3 min-h-[120px]"></div>
            </div>

            <!-- Coluna: Comprovante Enviado -->
            <div class="kanban-col flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm"></span>
                        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wide">🔍 Validar PIX</h2>
                    </div>
                    <span id="count-comprovante_enviado" class="bg-blue-100 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-200">0</span>
                </div>
                <div id="col-comprovante_enviado" class="flex flex-col gap-3 min-h-[120px]"></div>
            </div>

            <!-- Coluna: Confirmado -->
            <div class="kanban-col flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm"></span>
                        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wide">✅ Confirmado</h2>
                    </div>
                    <span id="count-confirmado" class="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">0</span>
                </div>
                <div id="col-confirmado" class="flex flex-col gap-3 min-h-[120px]"></div>
            </div>

            <!-- Coluna: Cancelado -->
            <div class="kanban-col flex flex-col gap-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-rose-400 shadow-sm"></span>
                        <h2 class="text-xs font-bold text-slate-600 uppercase tracking-wide">❌ Cancelado</h2>
                    </div>
                    <span id="count-cancelado" class="bg-rose-100 text-rose-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-rose-200">0</span>
                </div>
                <div id="col-cancelado" class="flex flex-col gap-3 min-h-[120px]"></div>
            </div>
        </div>

    </div>

    <script>
        const urlDados = 'https://n8n.orbbotia.com/webhook/pedidos-dados';
        const urlAcao = 'https://n8n.orbbotia.com/webhook/pedidos-acao';

        let globalAccountId = null;
        let handshakeInterval;
        let listaPedidos = [];

        document.getElementById('filtroData').value = new Date().toISOString().split('T')[0];

        function setHoje() {
            document.getElementById('filtroData').value = new Date().toISOString().split('T')[0];
            carregarPedidos();
        }

        const STATUS_CONFIG = {
            aguardando_pix: { label: 'Aguardando PIX', proximo: 'comprovante_enviado', btnProximoLabel: 'Comprovante Recebido ✓', btnProximoCor: 'bg-blue-600 hover:bg-blue-700', podeCancel: true },
            pagamento_entrega: { label: 'Pagamento na Entrega', proximo: 'confirmado', btnProximoLabel: 'Aprovar / Enviar ✅', btnProximoCor: 'bg-emerald-600 hover:bg-emerald-700', podeCancel: true },
            comprovante_enviado: { label: 'Comprovante Enviado', anterior: 'aguardando_pix', btnAnteriorLabel: '← Reenviar PIX', btnAnteriorCor: 'bg-amber-500 hover:bg-amber-600', proximo: 'confirmado', btnProximoLabel: 'Aprovar Pagamento ✅', btnProximoCor: 'bg-emerald-600 hover:bg-emerald-700', podeCancel: true },
            confirmado: { label: 'Confirmado', podeCancel: false },
            cancelado: { label: 'Cancelado', podeCancel: false }
        };

        /* =============================================
           COMUNICAÇÃO E REDIRECIONAMENTO (CHATWOOT)
        ============================================= */
        window.addEventListener('message', function (event) {
            let eventData = {};
            try { eventData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch (e) { return; }
            if (eventData.event === 'appContext' && eventData.data) {
                clearInterval(handshakeInterval);
                const payload = eventData.data;
                globalAccountId = (payload.account && payload.account.id) || (payload.conversation && payload.conversation.account_id);
                iniciarApp();
            }
        });

        handshakeInterval = setInterval(() => {
            if (!globalAccountId) window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
        }, 500);

        setTimeout(() => {
            if (!globalAccountId) {
                document.getElementById('alerta-chatwoot').innerText = 'Modo de teste (account_id = 2)';
                globalAccountId = '2';
                iniciarApp();
            }
        }, 2000);

        function iniciarApp() {
            document.getElementById('alerta-chatwoot').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            carregarPedidos();
        }

       // Função de Redirecionamento Direto para o Chat do Chatwoot
function abrirChat(conversaId) {
    if (!conversaId || conversaId === '?' || conversaId === 'null' || conversaId === 'undefined') {
        mostrarToast('Pedido sem ID de conversa vinculado', 'error');
        return;
    }

    const pathRelativo = `/app/accounts/${globalAccountId}/conversations/${conversaId}`;

    // 1. Detecção do Ambiente Mobile (React Native / App Nativo)
    const isMobileApp = !!window.ReactNativeWebView || navigator.userAgent.includes('Chatwoot');

    if (isMobileApp) {
        // Solução Mobile: Injeta iframe invisível com o Custom URL Scheme para não dar crash/tela branca
        const iframeMobile = document.createElement('iframe');
        iframeMobile.style.display = 'none';
        iframeMobile.src = `chatwootapp://${pathRelativo}`;
        document.body.appendChild(iframeMobile);
        
        setTimeout(() => {
            iframeMobile.remove();
        }, 1000);
    } else {
        // Solução Web Desktop: Força a janela principal do Chatwoot (janela Pai) a navegar para a conversa
        try {
            if (window.top && window.top !== window) {
                window.top.location.href = pathRelativo;
            } else {
                window.location.href = pathRelativo;
            }
        } catch (e) {
            // Fallback caso haja restrição estrita de origin
            window.open(pathRelativo, '_top');
        }
    }
}
           CARREGAR DADOS E RENDERIZAR KANBAN
        ============================================= */
        async function carregarPedidos() {
            document.getElementById('area-loading').classList.remove('hidden');
            document.getElementById('kanban-board').classList.add('hidden');
            const dataSelecionada = document.getElementById('filtroData').value;

            try {
                const res = await fetch(`${urlDados}?account_id=${globalAccountId}&data_filtro=${dataSelecionada}`);
                if (!res.ok) throw new Error('Erro ao buscar pedidos');
                const dados = await res.json();
                listaPedidos = Array.isArray(dados) ? dados : (dados.data || []);
                renderizarKanban();
            } catch (error) {
                document.getElementById('area-loading').innerHTML = `
                    <div class="text-center space-y-2">
                        <p class="text-sm text-rose-500 font-medium">⚠️ Não foi possível carregar os pedidos.</p>
                        <button onclick="carregarPedidos()" class="text-xs text-indigo-600 underline">Tentar novamente</button>
                    </div>
                `;
            }
        }

        function renderizarKanban() {
            const colunas = ['aguardando_pix', 'pagamento_entrega', 'comprovante_enviado', 'confirmado', 'cancelado'];

            colunas.forEach(s => {
                document.getElementById(`col-${s}`).innerHTML = '';
                document.getElementById(`count-${s}`).textContent = '0';
            });

            const pedidosAtivos = listaPedidos.filter(item => {
                const p = item.json ? item.json : item;
                return p.deletado !== true;
            });

            const contagens = Object.fromEntries(colunas.map(s => [s, 0]));

            pedidosAtivos.forEach(pedidoRaw => {
                const p = pedidoRaw.json ? pedidoRaw.json : pedidoRaw;
                let status = p.status || 'aguardando_pix';
                const formaPgto = (p.forma_pagamento || '').toLowerCase();
                
                if (status === 'aguardando_pix' && (formaPgto.includes('cartao') || formaPgto.includes('dinheiro') || formaPgto.includes('cartão'))) {
                    status = 'pagamento_entrega';
                }

                const coluna = document.getElementById(`col-${status}`);
                if (!coluna) return;

                contagens[status] = (contagens[status] || 0) + 1;
                coluna.appendChild(criarCard(p, status));
            });

            Object.entries(contagens).forEach(([status, total]) => {
                document.getElementById(`count-${status}`).textContent = total;
            });

            colunas.forEach(status => {
                if (contagens[status] === 0) {
                    document.getElementById(`col-${status}`).innerHTML = `
                        <div class="flex items-center justify-center py-8 border-2 border-dashed border-slate-200 rounded-xl text-slate-300 text-xs font-medium">
                            Nenhum pedido
                        </div>
                    `;
                }
            });

            document.getElementById('area-loading').classList.add('hidden');
            document.getElementById('kanban-board').classList.remove('hidden');
        }

        function criarCard(p, statusCalculado) {
            const config = STATUS_CONFIG[statusCalculado] || {};
            const valor = parseFloat(p.valor_total || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            const dataStr = p.created_at ? new Date(p.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';

            // Lógica de Cores da Forma de Pagamento e do Valor
            const formaPgto = (p.forma_pagamento || 'PIX').toUpperCase();
            let badgePgtoClass = 'bg-slate-100 text-slate-700 border-slate-200';
            let textColorClass = 'text-slate-700';

            if (formaPgto.includes('PIX')) {
                badgePgtoClass = 'bg-teal-50 text-teal-700 border-teal-200';
                textColorClass = 'text-teal-700';
            } else if (formaPgto.includes('DINHEIRO')) {
                badgePgtoClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                textColorClass = 'text-emerald-700';
            } else if (formaPgto.includes('CARTAO') || formaPgto.includes('CARTÃO')) {
                badgePgtoClass = 'bg-indigo-50 text-indigo-700 border-indigo-200';
                textColorClass = 'text-indigo-700';
            }

            let itensHtml = '';
            if (Array.isArray(p.itens) && p.itens.length > 0) {
                itensHtml = `<div class="flex flex-wrap gap-1">
                    ${p.itens.map(i => `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded font-medium">${i.quantidade || 1}× ${i.nome}</span>`).join('')}
                </div>`;
            }

            let botoesHtml = '';
            if (config.anterior) botoesHtml += `<button onclick="moverStatus('${p.id}', '${config.anterior}', this)" class="text-[10px] font-semibold text-white px-2.5 py-1.5 rounded-md ${config.btnAnteriorCor} transition-colors disabled:opacity-50">${config.btnAnteriorLabel}</button>`;
            if (config.proximo) botoesHtml += `<button onclick="moverStatus('${p.id}', '${config.proximo}', this)" class="text-[10px] font-semibold text-white px-2.5 py-1.5 rounded-md ${config.btnProximoCor} transition-colors disabled:opacity-50">${config.btnProximoLabel}</button>`;
            if (config.podeCancel) botoesHtml += `<button onclick="cancelarPedido('${p.id}', this)" class="text-[10px] font-semibold text-rose-600 border border-rose-200 bg-white hover:bg-rose-50 px-2.5 py-1.5 rounded-md transition-colors disabled:opacity-50">Cancelar ✕</button>`;

            const card = document.createElement('div');
            card.id = `card-${p.id}`;
            card.className = 'card-pedido bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm space-y-2.5';
            
            // Nova Estrutura HTML do Card
            card.innerHTML = `
                <div class="flex items-start justify-between gap-2">
                    <div>
                        <p class="text-sm font-bold text-slate-800 leading-snug">${p.cliente_nome || 'Cliente'}</p>
                        <span class="text-[10px] text-slate-500 font-mono">${p.cliente_telefone || ''}</span>
                    </div>
                    <!-- Botão de Chat com o ID da Conversa -->
                    <button onclick="abrirChat('${p.conversa_id}')" title="Ir para o Chat" class="flex items-center gap-1 text-xs font-extrabold text-indigo-600 bg-indigo-50 border border-indigo-100 hover:bg-indigo-100 px-2 py-1 rounded-lg transition-colors shrink-0">
                        💬 #${p.conversa_id || '?'}
                    </button>
                </div>

                <!-- Forma de Pagamento e Valor Agrupados -->
                <div class="flex items-center gap-1.5">
                    <span class="text-[9px] font-bold border px-2 py-0.5 rounded-md uppercase tracking-wider ${badgePgtoClass}">
                        💳 ${formaPgto}
                    </span>
                    <span class="text-[11px] font-extrabold ${textColorClass}">${valor}</span>
                </div>

                ${itensHtml}
                ${p.endereco_entrega ? `<p class="text-[10px] text-slate-500 flex items-start gap-1"><span>📍</span><span>${p.endereco_entrega}</span></p>` : ''}
                ${p.observacoes ? `<p class="text-[10px] text-amber-800 bg-amber-50 border border-amber-200 px-2 py-1 rounded-lg">⚠️ ${p.observacoes}</p>` : ''}
                ${botoesHtml ? `<div class="flex flex-wrap gap-1.5 pt-1 border-t border-slate-100">${botoesHtml}</div>` : ''}
                ${dataStr ? `<p class="text-[9px] text-slate-300 text-right mt-1">${dataStr}</p>` : ''}
            `;

            return card;
        }

        /* =============================================
           AÇÕES DO KANBAN
        ============================================= */
        async function moverStatus(id, novoStatus, btn) {
            const payload = { action: 'status', account_id: globalAccountId.toString(), id: id, status: novoStatus };
            await enviarAcao(payload, btn, () => {
                atualizarStatusLocal(id, novoStatus);
                renderizarKanban();
                mostrarToast(`Movido: ${STATUS_CONFIG[novoStatus]?.label || novoStatus}`, 'success');
            });
        }

        async function cancelarPedido(id, btn) {
            if (!confirm('Confirmar cancelamento do pedido?')) return;
            const payload = { action: 'status', account_id: globalAccountId.toString(), id: id, status: 'cancelado' };
            await enviarAcao(payload, btn, () => {
                atualizarStatusLocal(id, 'cancelado');
                renderizarKanban();
                mostrarToast('Pedido cancelado', 'error');
            });
        }

        function atualizarStatusLocal(id, novoStatus) {
            const item = listaPedidos.find(i => (i.json ? i.json : i).id === id);
            if (item) {
                const p = item.json ? item.json : item;
                p.status = novoStatus;
            }
        }

        async function enviarAcao(payload, btn, onSuccess) {
            const htmlOriginal = btn.innerHTML;
            btn.innerHTML = '⏳';
            btn.disabled = true;

            try {
                const res = await fetch(urlAcao, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) onSuccess();
                else throw new Error('Falha no servidor');
            } catch (error) {
                mostrarToast('Erro ao comunicar com o servidor', 'error');
                btn.innerHTML = htmlOriginal;
                btn.disabled = false;
            }
        }

        function mostrarToast(msg, tipo) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-xl text-sm font-semibold text-white transition-all ${tipo === 'success' ? 'bg-emerald-600' : 'bg-rose-600'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2500);
        }
    </script>
</body>
</html>
