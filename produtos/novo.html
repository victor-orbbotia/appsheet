<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio / Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .input-field {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; 
            border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
            font-size: 0.875rem;
        }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
    </style>
</head>
<body class="p-4 md:p-6 space-y-6">

    <div id="alerta-chatwoot" class="max-w-3xl mx-auto bg-amber-50 text-amber-700 text-xs p-3 rounded border border-amber-200 shadow-sm">
        ⏳ Conectando ao painel...
    </div>

    <div id="app-container" class="max-w-3xl mx-auto space-y-6 hidden">
        
        <div class="bg-white shadow-sm border border-slate-200 rounded-lg overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-slate-100 bg-slate-50/50">
                <h1 class="text-lg font-semibold text-slate-800">Novo Produto</h1>
                <button type="button" id="btnSalvar" onclick="salvarProduto()" class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded hover:bg-blue-800 transition-colors shadow-sm">
                    Salvar Produto
                </button>
            </div>

            <form id="formProduto" class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome do Produto *</label>
                    <input type="text" id="nome" required class="input-field" placeholder="Ex: Pizza de Calabresa">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição</label>
                    <textarea id="descricao" class="input-field" rows="2" placeholder="Ex: Molho de tomate, mussarela e calabresa."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoria</label>
                    <input list="lista-categorias" id="categoria" class="input-field" placeholder="Selecione ou digite nova...">
                    <datalist id="lista-categorias">
                        <option value="Pizzas">
                        <option value="Bebidas">
                        <option value="Hambúrgueres">
                    </datalist>
                </div>

                <!-- SELETOR DE TEMPLATE (O segredo da flexibilidade) -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo de Venda</label>
                    <select id="tipo_venda" class="input-field bg-white" onchange="alternarCamposPreco()">
                        <option value="simples">Preço Único (Simples)</option>
                        <option value="tamanhos">Variação por Tamanho (Ex: Pizza/Refri)</option>
                    </select>
                </div>

                <!-- SESSÃO PREÇO ÚNICO -->
                <div id="sessao-preco-simples" class="md:col-span-2 p-4 bg-slate-50 border border-slate-200 rounded-lg">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Preço Base (R$)</label>
                    <input type="number" id="preco_base" class="input-field max-w-[200px]" placeholder="0.00" step="0.01">
                </div>

                <!-- SESSÃO TAMANHOS DINAÂMICOS -->
                <div id="sessao-tamanhos" class="md:col-span-2 p-4 bg-blue-50 border border-blue-200 rounded-lg hidden space-y-3">
                    <h3 class="text-sm font-bold text-blue-800">Tamanhos e Preços</h3>
                    <p class="text-xs text-blue-600 mb-2">Adicione as opções que o cliente poderá escolher.</p>
                    
                    <div id="lista-de-tamanhos" class="space-y-2">
                        <!-- O Javascript vai inserir os campos aqui -->
                    </div>
                    
                    <button type="button" onclick="adicionarTamanho()" class="text-xs font-bold text-blue-700 bg-white border border-blue-300 px-3 py-1.5 rounded hover:bg-blue-100">
                        + Adicionar Tamanho
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script>
        const urlAcao = 'https://n8n.orbbotia.com/webhook/produtos-acao';
        let globalAccountId = null;

        // Fake Chatwoot Init (Mantenha sua lógica original aqui)
        setTimeout(() => {
            document.getElementById('alerta-chatwoot').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            globalAccountId = '2'; 
            adicionarTamanho(); // Inicia com um tamanho em branco caso escolha essa opção
        }, 1000);

        // Lógica de mostrar/esconder campos baseada no Tipo de Venda
        function alternarCamposPreco() {
            const tipo = document.getElementById('tipo_venda').value;
            const divSimples = document.getElementById('sessao-preco-simples');
            const divTamanhos = document.getElementById('sessao-tamanhos');

            if (tipo === 'simples') {
                divSimples.classList.remove('hidden');
                divTamanhos.classList.add('hidden');
            } else {
                divSimples.classList.add('hidden');
                divTamanhos.classList.remove('hidden');
            }
        }

        // Criar campos de tamanho dinamicamente
        function adicionarTamanho() {
            const container = document.getElementById('lista-de-tamanhos');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="Nome (Ex: Média)" class="input-field w-1/2 input-tamanho-nome">
                <input type="number" placeholder="Preço (Ex: 45.00)" class="input-field w-1/3 input-tamanho-preco" step="0.01">
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 font-bold px-2 hover:bg-rose-100 rounded">X</button>
            `;
            container.appendChild(div);
        }

        // SALVAR PRODUTO: Aqui montamos o JSONB poderoso!
        // SALVAR PRODUTO NO BANCO DE DADOS
        async function salvarProduto() {
            // (Opcional no futuro) Se tiver um campo de ID oculto para edição
            const id = document.getElementById('produto_id') ? document.getElementById('produto_id').value : ''; 
            
            const nome = document.getElementById('nome').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const categoria = document.getElementById('categoria').value.trim();
            const tipo = document.getElementById('tipo_venda').value;
            
            if (!nome) return alert("Preencha o nome do produto!");

            let precoBase = 0.00;
            let metadata = {}; // O nosso JSONB

            if (tipo === 'simples') {
                precoBase = parseFloat(document.getElementById('preco_base').value) || 0.00;
                metadata = { tipo: 'simples' };
            } 
            else if (tipo === 'tamanhos') {
                precoBase = 0.00; 
                
                const nomes = document.querySelectorAll('.input-tamanho-nome');
                const precos = document.querySelectorAll('.input-tamanho-preco');
                let arrayTamanhos = [];
                
                for(let i = 0; i < nomes.length; i++) {
                    if (nomes[i].value) {
                        arrayTamanhos.push({
                            nome: nomes[i].value,
                            preco: parseFloat(precos[i].value) || 0.00
                        });
                    }
                }
                
                if(arrayTamanhos.length === 0) return alert("Adicione pelo menos um tamanho!");
                
                metadata = { 
                    tipo: 'com_tamanhos',
                    tamanhos: arrayTamanhos 
                };
            }

            const btnSalvar = document.getElementById('btnSalvar');
            const txtOriginal = btnSalvar.innerText;
            btnSalvar.innerText = 'Salvando...';
            btnSalvar.disabled = true;

            // Monta o pacote de dados
            const payload = {
                action: id ? 'editar' : 'criar',
                id: id,
                account_id: globalAccountId.toString(),
                nome: nome,
                descricao: descricao,
                categoria: categoria,
                preco_base: precoBase,
                metadata: metadata 
            };

            // Envia para o n8n
            try {
                const response = await fetch(urlAcao, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btnSalvar.innerText = 'Salvo! ✓';
                    btnSalvar.classList.replace('bg-blue-700', 'bg-emerald-600');
                    
                    setTimeout(() => { 
                        btnSalvar.classList.replace('bg-emerald-600', 'bg-blue-700');
                        btnSalvar.innerText = txtOriginal; 
                        btnSalvar.disabled = false;
                        
                        // Limpa o formulário após salvar
                        document.getElementById('formProduto').reset();
                        alternarCamposPreco(); // Reseta os campos que aparecem/somem
                        
                        // Se você já tiver criado a função carregarLista() para Produtos, descomente abaixo:
                        // carregarLista(); 
                    }, 1500);
                } else {
                    throw new Error("Erro na requisição n8n");
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao salvar o produto no banco de dados.");
                btnSalvar.innerText = txtOriginal;
                btnSalvar.disabled = false;
            }
        }
    </script>
</body>
</html>
