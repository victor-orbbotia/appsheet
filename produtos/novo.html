<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio / Produtos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: system-ui, sans-serif; }
        .input-field {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; 
            border-radius: 0.375rem; outline: none; transition: border-color 0.2s;
            font-size: 0.875rem;
        }
        .input-field:focus { border-color: #2563eb; box-shadow: 0 0 0 1px #2563eb; }
    </style>
</head>
<body class="p-4 md:p-6 space-y-6">

    <div id="alerta-chatwoot" class="max-w-4xl mx-auto bg-amber-50 text-amber-700 text-xs p-3 rounded border border-amber-200 shadow-sm">
        ⏳ Conectando ao painel...
    </div>

    <div id="app-container" class="max-w-4xl mx-auto space-y-6 hidden">
        
        <!-- BLOCO 1: FORMULÁRIO -->
        <div class="bg-white shadow-sm border border-slate-200 rounded-lg overflow-hidden">
            <div class="flex flex-wrap justify-between items-center p-4 md:p-6 border-b border-slate-100 bg-slate-50/50 gap-4">
                <h1 id="titulo-form" class="text-lg font-semibold text-slate-800">Novo Produto</h1>
                
                <div class="flex gap-2 md:gap-3">
                    <button type="button" id="btnExcluir" onclick="excluirProduto()" class="hidden px-3 md:px-4 py-2 text-xs md:text-sm font-medium text-rose-700 bg-white border border-rose-200 hover:bg-rose-50 rounded transition-colors">
                        🗑️ Excluir
                    </button>
                    <button type="button" id="btnStatus" onclick="alternarStatus()" class="hidden px-3 md:px-4 py-2 text-xs md:text-sm font-medium text-white rounded transition-colors shadow-sm">
                        Desativar
                    </button>
                    <button type="button" onclick="limparFormulario()" class="px-3 md:px-4 py-2 text-xs md:text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded hover:bg-slate-50 transition-colors">
                        Cancelar
                    </button>
                    <button type="button" id="btnSalvar" onclick="salvarProduto()" class="px-4 py-2 text-sm font-medium text-white bg-blue-700 rounded hover:bg-blue-800 transition-colors shadow-sm">
                        Salvar
                    </button>
                </div>
            </div>

            <form id="formProduto" class="p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="produto_id" value="">

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome do Produto <span class="text-blue-600">*</span></label>
                    <input type="text" id="nome" required class="input-field" placeholder="Ex: Pizza de Calabresa">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descrição</label>
                    <textarea id="descricao" class="input-field" rows="2" placeholder="Ex: Molho de tomate, mussarela e calabresa."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Categoria</label>
                    <input list="lista-categorias" id="categoria" class="input-field" placeholder="Selecione ou digite nova...">
                    <datalist id="lista-categorias">
                        <option value="Pizzas">
                        <option value="Bebidas">
                        <option value="Hambúrgueres">
                    </datalist>
                </div>

                <!-- SELETOR DE TEMPLATE -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tipo de Venda</label>
                    <select id="tipo_venda" class="input-field bg-white" onchange="alternarCamposPreco()">
                        <option value="simples">Preço Único (Simples)</option>
                        <option value="tamanhos">Variação por Tamanho (Ex: Pizza/Refri)</option>
                    </select>
                </div>

                <!-- SESSÃO PREÇO ÚNICO -->
                <div id="sessao-preco-simples" class="md:col-span-2 p-4 bg-slate-50 border border-slate-200 rounded-lg">
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Preço Base (R$)</label>
                    <input type="number" id="preco_base" class="input-field max-w-[200px]" placeholder="0.00" step="0.01">
                </div>

                <!-- SESSÃO TAMANHOS DINAÂMICOS -->
                <div id="sessao-tamanhos" class="md:col-span-2 p-4 bg-blue-50 border border-blue-200 rounded-lg hidden space-y-3">
                    <h3 class="text-sm font-bold text-blue-800">Tamanhos e Preços</h3>
                    <div id="lista-de-tamanhos" class="space-y-2"></div>
                    <button type="button" onclick="adicionarTamanho()" class="text-xs font-bold text-blue-700 bg-white border border-blue-300 px-3 py-1.5 rounded hover:bg-blue-100">
                        + Adicionar Tamanho
                    </button>
                </div>
            </form>
        </div>

        <!-- BLOCO 2: LISTA DE PRODUTOS -->
        <div class="bg-white shadow-sm border border-slate-200 rounded-lg overflow-hidden">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-md font-semibold text-slate-800">Cardápio Cadastrado</h2>
                <button onclick="carregarLista()" class="text-xs text-slate-500 hover:text-blue-600 font-medium">🔄 Atualizar</button>
            </div>
            <div class="p-0 overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
                        <tr>
                            <th class="px-4 py-3 border-b w-24">Status</th>
                            <th class="px-4 py-3 border-b">Produto</th>
                            <th class="px-4 py-3 border-b">Categoria</th>
                            <th class="px-4 py-3 border-b">Preço / Detalhes</th>
                            <th class="px-4 py-3 border-b text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos" class="divide-y divide-slate-100">
                        <tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const urlDados = 'https://n8n.orbbotia.com/webhook/produtos-dados';
        const urlAcao  = 'https://n8n.orbbotia.com/webhook/produtos-acao';
        
        let globalAccountId = null;
        let handshakeInterval;
        let listaAtual = [];
        let statusAtualEdicao = true;

        /* =========================================
           COMUNICAÇÃO COM CHATWOOT
           ========================================= */
        window.addEventListener('message', function (event) {
            let eventData = {};
            try { eventData = typeof event.data === 'string' ? JSON.parse(event.data) : event.data; } catch (e) { return; }

            if (eventData.event === 'appContext' && eventData.data) {
                clearInterval(handshakeInterval);
                const payload = eventData.data;
                globalAccountId = (payload.account && payload.account.id) || (payload.conversation && payload.conversation.account_id);
                iniciarApp();
            }
        });

        handshakeInterval = setInterval(() => {
            if (!globalAccountId) window.parent.postMessage('chatwoot-dashboard-app:fetch-info', '*');
        }, 500);

        setTimeout(() => {
            if(!globalAccountId) {
                globalAccountId = '2';
                iniciarApp();
            }
        }, 2000);

        function iniciarApp() {
            document.getElementById('alerta-chatwoot').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            carregarLista();
            if(document.getElementById('lista-de-tamanhos').children.length === 0) adicionarTamanho();
        }

        /* =========================================
           LÓGICA DE INTERFACE DO FORMULÁRIO
           ========================================= */
        function alternarCamposPreco() {
            const tipo = document.getElementById('tipo_venda').value;
            if (tipo === 'simples') {
                document.getElementById('sessao-preco-simples').classList.remove('hidden');
                document.getElementById('sessao-tamanhos').classList.add('hidden');
            } else {
                document.getElementById('sessao-preco-simples').classList.add('hidden');
                document.getElementById('sessao-tamanhos').classList.remove('hidden');
            }
        }

        function adicionarTamanho(nome = '', preco = '') {
            const container = document.getElementById('lista-de-tamanhos');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="Nome (Ex: Média)" value="${nome}" class="input-field w-1/2 input-tamanho-nome">
                <input type="number" placeholder="Preço (Ex: 45.00)" value="${preco}" class="input-field w-1/3 input-tamanho-preco" step="0.01">
                <button type="button" onclick="this.parentElement.remove()" class="text-rose-500 font-bold px-2 hover:bg-rose-100 rounded">X</button>
            `;
            container.appendChild(div);
        }

        function formatarMoeda(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        /* =========================================
           LÓGICA DE DADOS (LISTAR)
           ========================================= */
        async function carregarLista() {
            const tbody = document.getElementById('lista-produtos');
            tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-blue-500">⏳ Sincronizando...</td></tr>`;
            try {
                const res = await fetch(`${urlDados}?account_id=${globalAccountId}`);
                if (!res.ok) throw new Error("Erro ao buscar");
                const dados = await res.json();
                listaAtual = Array.isArray(dados) ? dados : (dados.data || []);
                renderizarTabela();
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-4 text-center text-red-500">Erro ao carregar lista.</td></tr>`;
            }
        }

        function renderizarTabela() {
            const tbody = document.getElementById('lista-produtos');
            tbody.innerHTML = '';

            const listaFiltrada = listaAtual.filter(item => {
                const p = item.json ? item.json : item;
                return p.deletado !== true;
            });

            if (listaFiltrada.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Nenhum produto cadastrado.</td></tr>`;
                return;
            }

            listaFiltrada.forEach(prod => {
                const p = prod.json ? prod.json : prod; 
                const isAtivo = p.ativo !== false; 
                
                // Trata a visualização inteligente de preços (lendo o JSON metadata)
                let precoDisplay = formatarMoeda(p.preco_base);
                if (p.metadata && p.metadata.tipo === 'com_tamanhos' && Array.isArray(p.metadata.tamanhos)) {
                    let tamanhosListados = p.metadata.tamanhos.map(t => `<span class="bg-blue-50 text-blue-700 text-[10px] px-1.5 py-0.5 rounded border border-blue-200 mr-1">${t.nome}: ${formatarMoeda(t.preco)}</span>`).join('');
                    precoDisplay = `<div class="flex flex-wrap gap-1 mt-1">${tamanhosListados}</div>`;
                }
                
                const tr = document.createElement('tr');
                tr.className = `transition-colors ${isAtivo ? 'hover:bg-slate-50' : 'bg-slate-50/70 opacity-70'}`;
                tr.innerHTML = `
                    <td class="px-4 py-3">
                        ${isAtivo 
                            ? '<span class="bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] uppercase font-bold px-2 py-0.5 rounded">Ativo</span>' 
                            : '<span class="bg-slate-200 text-slate-600 border border-slate-300 text-[10px] uppercase font-bold px-2 py-0.5 rounded">Inativo</span>'}
                    </td>
                    <td class="px-4 py-3">
                        <div class="font-medium text-slate-800">${p.nome}</div>
                        <div class="text-[10px] text-slate-400 max-w-[200px] truncate" title="${p.descricao || ''}">${p.descricao || ''}</div>
                    </td>
                    <td class="px-4 py-3"><span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded font-medium">${p.categoria || '-'}</span></td>
                    <td class="px-4 py-3">${precoDisplay}</td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="editarProduto('${p.id}')" class="text-blue-600 hover:text-blue-800 font-medium text-xs bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded transition-colors">
                            Editar ✏️
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /* =========================================
           AÇÕES (EDITAR, SALVAR, EXCLUIR, STATUS)
           ========================================= */
        function editarProduto(id) {
            const prodObj = listaAtual.find(item => {
                const p = item.json ? item.json : item;
                return p.id == id;
            });
            if (!prodObj) return;
            const p = prodObj.json ? prodObj.json : prodObj;

            document.getElementById('produto_id').value = p.id;
            document.getElementById('nome').value = p.nome || '';
            document.getElementById('descricao').value = p.descricao || '';
            document.getElementById('categoria').value = p.categoria || '';

            // Lógica para preencher Preço Simples ou Tamanhos
            const containerTamanhos = document.getElementById('lista-de-tamanhos');
            containerTamanhos.innerHTML = ''; // limpa tamanhos

            if (p.metadata && p.metadata.tipo === 'com_tamanhos') {
                document.getElementById('tipo_venda').value = 'tamanhos';
                if(p.metadata.tamanhos) {
                    p.metadata.tamanhos.forEach(t => adicionarTamanho(t.nome, t.preco));
                }
            } else {
                document.getElementById('tipo_venda').value = 'simples';
                document.getElementById('preco_base').value = p.preco_base || '';
                adicionarTamanho(); // deixa 1 em branco oculto
            }
            alternarCamposPreco();

            // Status e Exclusão
            statusAtualEdicao = p.ativo !== false;
            const btnStatus = document.getElementById('btnStatus');
            btnStatus.classList.remove('hidden', 'bg-slate-600', 'hover:bg-slate-700', 'bg-emerald-600', 'hover:bg-emerald-700');
            if (statusAtualEdicao) {
                btnStatus.innerText = "Desativar";
                btnStatus.classList.add('bg-slate-600', 'hover:bg-slate-700');
            } else {
                btnStatus.innerText = "Reativar 🟢";
                btnStatus.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            }

            document.getElementById('btnExcluir').classList.remove('hidden');
            document.getElementById('titulo-form').innerText = "Editando: " + p.nome;
            document.getElementById('btnSalvar').innerText = "Atualizar Produto";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limparFormulario() {
            document.getElementById('formProduto').reset();
            document.getElementById('produto_id').value = '';
            document.getElementById('titulo-form').innerText = "Novo Produto";
            document.getElementById('btnSalvar').innerText = "Salvar Produto";
            document.getElementById('btnStatus').classList.add('hidden');
            document.getElementById('btnExcluir').classList.add('hidden');
            
            document.getElementById('tipo_venda').value = 'simples';
            document.getElementById('lista-de-tamanhos').innerHTML = '';
            adicionarTamanho();
            alternarCamposPreco();
        }

        async function enviarAcao(payload, btnElement, txtSucesso) {
            const txtOriginal = btnElement.innerText;
            btnElement.innerText = 'Processando...';
            btnElement.disabled = true;

            try {
                const response = await fetch(urlAcao, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    btnElement.innerText = txtSucesso;
                    
                    if (payload.action === 'deletar') {
                        listaAtual = listaAtual.filter(item => {
                            const p = item.json ? item.json : item;
                            return p.id != payload.id;
                        });
                    }

                    setTimeout(() => {
                        btnElement.innerText = txtOriginal;
                        limparFormulario();
                        renderizarTabela(); 
                        carregarLista(); 
                        btnElement.disabled = false;
                    }, 1000);
                } else { throw new Error(); }
            } catch (error) {
                alert("Erro ao comunicar com o servidor.");
                btnElement.innerText = txtOriginal;
                btnElement.disabled = false;
            }
        }

        function alternarStatus() {
            const id = document.getElementById('produto_id').value;
            if (!id) return;
            const payload = { action: 'status', account_id: globalAccountId.toString(), id: id, ativo: !statusAtualEdicao };
            enviarAcao(payload, document.getElementById('btnStatus'), 'Feito ✓');
        }

        function excluirProduto() {
            const id = document.getElementById('produto_id').value;
            if (!id) return;
            if (confirm("ATENÇÃO: Deseja apagar este produto permanentemente?")) {
                const payload = { action: 'deletar', account_id: globalAccountId.toString(), id: id };
                enviarAcao(payload, document.getElementById('btnExcluir'), 'Excluído!');
            }
        }

        function salvarProduto() {
            const id = document.getElementById('produto_id').value; 
            const nome = document.getElementById('nome').value.trim();
            const descricao = document.getElementById('descricao').value.trim();
            const categoria = document.getElementById('categoria').value.trim();
            const tipo = document.getElementById('tipo_venda').value;
            
            if (!nome) return alert("Preencha o nome do produto!");

            let precoBase = 0.00;
            let metadata = {}; 

            if (tipo === 'simples') {
                precoBase = parseFloat(document.getElementById('preco_base').value) || 0.00;
                metadata = { tipo: 'simples' };
            } else if (tipo === 'tamanhos') {
                precoBase = 0.00; 
                const nomes = document.querySelectorAll('.input-tamanho-nome');
                const precos = document.querySelectorAll('.input-tamanho-preco');
                let arrayTamanhos = [];
                for(let i = 0; i < nomes.length; i++) {
                    if (nomes[i].value) {
                        arrayTamanhos.push({ nome: nomes[i].value, preco: parseFloat(precos[i].value) || 0.00 });
                    }
                }
                if(arrayTamanhos.length === 0) return alert("Adicione pelo menos um tamanho!");
                metadata = { tipo: 'com_tamanhos', tamanhos: arrayTamanhos };
            }

            const payload = {
                action: id ? 'editar' : 'criar',
                id: id,
                account_id: globalAccountId.toString(),
                nome: nome,
                descricao: descricao,
                categoria: categoria,
                preco_base: precoBase,
                metadata: metadata 
            };

            enviarAcao(payload, document.getElementById('btnSalvar'), 'Salvo! ✓');
        }
    </script>
</body>
</html>
